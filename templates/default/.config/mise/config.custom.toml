# Custom profile: personal overrides that `turutan update` never overwrites.
# This file loads LAST (after config.toml and every config.<profile>.toml
# selected by MISE_ENV), so values here win over the shared defaults.
# Seed-only: edit freely. Update re-renders the template copy but keeps the
# file on disk, so local changes are preserved.
#
# Override the binary used by the turutan:* tasks (defaults to PATH lookup):
# ~keep
# [env]
# TURUTAN_BIN = "go run ./cmd/turutan"
#
# [tools]
# "github:protonpass/pass-cli" = "2"
#
# [tasks."dev-setup:fnox-provider"]
# secrets = ["PROTON_PASS_PERSONAL_ACCESS_TOKEN"]
# run = '''
# if ! pass-cli info; then
#     pass-cli logout
#     pass-cli login
# fi
# '''
#
# Pin an extra tool just for this checkout:
# [tools]
# my-tool = "1"
# 

[tasks."dev-setup:fnox-provider"]
run = "echo 'fnox provider is not configured yet'"
