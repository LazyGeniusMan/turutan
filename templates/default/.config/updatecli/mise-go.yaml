---
name: "mise: update go toolchain pins"
labels:
  profiles: go
  manager: updatecli
sources:
  go-toolchain:
    name: track go 1.26.x for go profile
    kind: golang
    spec:
      versionfilter:
        kind: semver
        pattern: 1.26.x
  go-golangci-lint:
    name: track golangci-lint 2.x for go profile
    kind: githubrelease
    spec:
      owner: golangci
      repository: golangci-lint
      versionfilter:
        kind: semver
        pattern: 2.x
  go-goreleaser:
    name: track goreleaser 2.x for go profile
    kind: githubrelease
    spec:
      owner: goreleaser
      repository: goreleaser
      versionfilter:
        kind: semver
        pattern: 2.x
  go-gosec:
    name: track gosec 2.x for go profile
    kind: githubrelease
    spec:
      owner: securego
      repository: gosec
      versionfilter:
        kind: semver
        pattern: 2.x
  go-govulncheck:
    name: track govulncheck 1.x for go profile
    kind: golang/module
    spec:
      module: golang.org/x/vuln
      versionfilter:
        kind: semver
        pattern: 1.x
