---
name: "mise: update ai toolchain pins"
labels:
  profiles: ai
  manager: updatecli
sources:
  ai-airulez:
    name: track ai-rulez 5.x for ai profile
    kind: githubrelease
    spec:
      owner: Goldziher
      repository: ai-rulez
      versionfilter:
        kind: semver
        pattern: 5.x
  ai-basemind:
    name: track basemind 0.x for ai profile
    kind: githubrelease
    spec:
      owner: Goldziher
      repository: basemind
      versionfilter:
        kind: semver
        pattern: 0.x
  ai-bun:
    name: track bun 1.x for ai profile
    kind: shell
    spec:
      command: mise latest bun 1
  ai-node:
    name: track node 24.x for ai profile
    kind: shell
    spec:
      command: mise latest node 24
  ai-opencode:
    name: track opencode cli 2.x for ai profile
    kind: npm
    spec:
      name: "@opencode/cli"
      versionfilter:
        kind: semver
        pattern: 2.x
  ai-uncomment:
    name: track uncomment 3.x for ai profile
    kind: githubrelease
    spec:
      owner: Goldziher
      repository: uncomment
      versionfilter:
        kind: semver
        pattern: 3.x
