---
name: "mise: update core toolchain pins"
labels:
  profiles: core
  manager: updatecli
sources:
  core-updatecli:
    name: track updatecli 0.x for core profile
    kind: githubrelease
    spec:
      owner: updatecli
      repository: updatecli
      versionfilter:
        kind: semver
        pattern: 0.x
  core-hk:
    name: track hk 2.x for core profile
    kind: githubrelease
    spec:
      owner: jdx
      repository: hk
      versionfilter:
        kind: semver
        pattern: 2.x
  core-pkl:
    name: track pkl 0.x for core profile
    kind: githubrelease
    spec:
      owner: apple
      repository: pkl
      versionfilter:
        kind: semver
        pattern: 0.x
  core-tombi:
    name: track tombi 1.x for core profile
    kind: githubrelease
    spec:
      owner: tombi-toml
      repository: tombi
      versionfilter:
        kind: semver
        pattern: 1.x
  core-betterleaks:
    name: track betterleaks 1.x for core profile
    kind: githubrelease
    spec:
      owner: betterleaks
      repository: betterleaks
      versionfilter:
        kind: semver
        pattern: 1.x
  core-fnox:
    name: track fnox 1.x for core profile
    kind: githubrelease
    spec:
      owner: jdx
      repository: fnox
      versionfilter:
        kind: semver
        pattern: 1.x
targets:
  mise-lock:
    name: regenerate mise lockfiles for active profiles
    kind: shell
    disablesourceinput: true
    spec:
      command: '[ "${DRY_RUN}" = "true" ] || mise lock'
      environments:
        - name: MISE_ENV
