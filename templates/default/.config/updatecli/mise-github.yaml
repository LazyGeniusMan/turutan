---
name: "mise: update github toolchain pins"
labels:
  profiles: github
  manager: updatecli
sources:
  github-gh:
    name: track gh 2.x for github profile
    kind: githubrelease
    spec:
      owner: cli
      repository: cli
      versionfilter:
        kind: semver
        pattern: 2.x
  github-jactionlint:
    name: track jactionlint 2.x for github profile
    kind: githubrelease
    spec:
      owner: jdx
      repository: jactionlint
      versionfilter:
        kind: semver
        pattern: 2.x
  github-ryl:
    name: track ryl 0.x for github profile
    kind: githubrelease
    spec:
      owner: owenlamont
      repository: ryl
      versionfilter:
        kind: semver
        pattern: 0.x
