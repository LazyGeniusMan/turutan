---
name: CI
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac
      - name: Install
        run: mise install
      - name: Check
        run: mise run check:diff
