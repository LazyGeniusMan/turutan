---
source: "git::https://github.com/LazyGeniusMan/turutan.git//templates/default"
min-engine: ">=0.1.0"
license: MIT-0
license-files: [LICENSE]
doc-files: [README.md]
conflict: inline
ignore:
  - "**/.git/**"
  - "**/node_modules/**"
  - ".config/turutan/state.json"
  - ".config/turutan/lock.json"
  - ".config/turutan/templates/**"
  - ".config/ai-rulez/.generated-manifest*.json"
  - ".turutan.yml"
  - ".turutan.yaml"
preserve:
  - "config/local.*.yml"
  - "data/**"
prompts:
  project_name:
    prompt: "Project name"
    type: string
  project_description:
    prompt: "Project description"
    type: string
    default: ""
  enabled_profiles:
    prompt: "Enabled profiles (comma-separated)"
    type: array
    default: ["core", "ai"]
    options:
      - "core"
      - "ai"
      - "c"
      - "cpp"
      - "csharp"
      - "cloudflare"
      - "docker"
      - "elixir"
      - "github"
      - "gitlab"
      - "go"
      - "java"
      - "kubernetes"
      - "php"
      - "python"
      - "r"
      - "ruby"
      - "rust"
      - "rust-polygot"
      - "typescript"
      - "typst"
      - "custom"
  enabled_ai_agents:
    prompt: "Enabled AI Agents (comma-separated)"
    type: array
    default: ["opencode", "pi"]
    options:
      - "claude"
      - "cursor"
      - "gemini"
      - "copilot"
      - "devin"
      - "cline"
      - "codex"
      - "amp"
      - "junie"
      - "opencode"
      - "hermes"
      - "antigravity"
      - "xum"
      - "pi"
      - "baz"
      - "mcp"
      - "aiassistant"
      - "augment"
      - "bob"
      - "codebuddy"
      - "codebuff"
      - "codewhale"
      - "commandcode"
      - "copilot-cli"
      - "cortex"
      - "crush"
      - "deepagents"
      - "dsh"
      - "factory"
      - "gitlab-duo"
      - "goose"
      - "grok"
      - "kilo"
      - "kimi"
      - "kiro"
      - "letta"
      - "mimocode"
      - "muse"
      - "omp"
      - "openclaw"
      - "poolside"
      - "qoder"
      - "qwen"
      - "reasonix"
      - "replit"
      - "rovodev"
      - "takt"
      - "trae"
      - "vibe"
      - "warp"
      - "zcode"
      - "zed"
      - "zoocode"
      - "okf"
      - "llms-txt"
profiles:
  ai:
    label: "AI"
    includes:
      - ".config/ai-rulez/config.toml"
      - ".config/ai-rulez/config.ai.toml"
      - ".config/ai-rulez/index.md"
      - ".config/ai-rulez/domains/core/**"
      - ".config/ai-rulez/domains/ai/**"
      - ".config/basemind/**"
      - ".uncomment.toml"
      - ".config/mise/config.ai.toml"
      - ".config/updatecli/mise-ai.yaml"
      - ".config/hk/ai.pkl"
  c:
    label: "C"
    includes:
      - ".config/mise/config.c.toml"
      - ".config/ai-rulez/config.c.toml"
      - ".config/ai-rulez/domains/c/**"
      - ".config/hk/c.pkl"
  cloudflare:
    label: "Cloudflare"
    includes:
      - ".config/mise/config.cloudflare.toml"
      - ".config/ai-rulez/config.cloudflare.toml"
      - ".config/ai-rulez/domains/cloudflare/**"
      - ".config/hk/cloudflare.pkl"
  cpp:
    label: "C++"
    includes:
      - ".config/mise/config.cpp.toml"
      - ".config/ai-rulez/config.cpp.toml"
      - ".config/ai-rulez/domains/cpp/**"
      - ".config/hk/cpp.pkl"
  csharp:
    label: "C#"
    includes:
      - ".config/mise/config.csharp.toml"
      - ".config/ai-rulez/config.csharp.toml"
      - ".config/ai-rulez/domains/csharp/**"
      - ".config/hk/csharp.pkl"
  custom:
    label: "Custom — your overrides, never overwritten"
    includes:
      - ".config/mise/config.custom.toml"
      - ".config/ai-rulez/config.custom.toml"
      - ".config/ai-rulez/domains/custom/**"
      - ".config/fnox.toml"
      - ".config/hk/custom.pkl"
      - ".gitignore"
  docker:
    label: "Docker"
    includes:
      - ".config/mise/config.docker.toml"
      - ".config/ai-rulez/config.docker.toml"
      - ".config/ai-rulez/domains/docker/**"
      - ".config/ai-rulez/domains/yml/**"
      - ".config/hk/docker.pkl"
  elixir:
    label: "Elixir"
    includes:
      - ".config/mise/config.elixir.toml"
      - ".config/ai-rulez/config.elixir.toml"
      - ".config/ai-rulez/domains/elixir/**"
      - ".config/hk/elixir.pkl"
  github:
    label: "GitHub"
    includes:
      - ".github/**"
      - ".github/jactionlint.yaml"
      - ".config/mise/config.github.toml"
      - ".config/ai-rulez/config.github.toml"
      - ".config/ai-rulez/domains/github/**"
      - ".config/ai-rulez/domains/yml/**"
      - ".config/ryl.toml"
      - ".config/updatecli/github-actions.yaml"
      - ".config/updatecli/mise-github.yaml"
      - ".config/hk/github.pkl"
  gitlab:
    label: "GitLab"
    includes:
      - ".config/mise/config.gitlab.toml"
      - ".config/ai-rulez/config.gitlab.toml"
      - ".config/ai-rulez/domains/gitlab/**"
      - ".config/hk/gitlab.pkl"
  go:
    label: "Go"
    includes:
      - ".golangci.yml"
      - ".config/golangci-lint/**"
      - ".config/goreleaser.yml"
      - ".config/mise/config.go.toml"
      - ".config/ai-rulez/config.go.toml"
      - ".config/ai-rulez/domains/go/**"
      - ".config/updatecli/go-version.yaml"
      - ".config/updatecli/mise-go.yaml"
      - ".config/hk/go.pkl"
  java:
    label: "Java"
    includes:
      - ".config/mise/config.java.toml"
      - ".config/ai-rulez/config.java.toml"
      - ".config/ai-rulez/domains/java/**"
      - ".config/hk/java.pkl"
  kubernetes:
    label: "Kubernetes"
    includes:
      - ".config/mise/config.kubernetes.toml"
      - ".config/ai-rulez/config.kubernetes.toml"
      - ".config/ai-rulez/domains/kubernetes/**"
      - ".config/ai-rulez/domains/yml/**"
      - ".config/hk/kubernetes.pkl"
  php:
    label: "PHP"
    includes:
      - ".config/mise/config.php.toml"
      - ".config/ai-rulez/config.php.toml"
      - ".config/ai-rulez/domains/php/**"
      - ".config/hk/php.pkl"
  python:
    label: "Python"
    includes:
      - ".config/mise/config.python.toml"
      - ".config/ai-rulez/config.python.toml"
      - ".config/ai-rulez/domains/python/**"
      - ".config/hk/python.pkl"
  r:
    label: "R"
    includes:
      - ".config/mise/config.r.toml"
      - ".config/ai-rulez/config.r.toml"
      - ".config/ai-rulez/domains/r/**"
      - ".config/hk/r.pkl"
  ruby:
    label: "Ruby"
    includes:
      - ".config/mise/config.ruby.toml"
      - ".config/ai-rulez/config.ruby.toml"
      - ".config/ai-rulez/domains/ruby/**"
      - ".config/hk/ruby.pkl"
  rust:
    label: "Rust"
    includes:
      - ".config/mise/config.rust.toml"
      - ".config/ai-rulez/config.rust.toml"
      - ".config/ai-rulez/domains/rust/**"
      - ".config/hk/rust.pkl"
  rust-polygot:
    label: "Rust Polyglot"
    includes:
      - ".config/mise/config.rust-polygot.toml"
      - ".config/ai-rulez/config.rust-polygot.toml"
      - ".config/ai-rulez/domains/rust-polygot/**"
      - ".config/hk/rust-polygot.pkl"
  typescript:
    label: "TypeScript"
    includes:
      - ".config/mise/config.typescript.toml"
      - ".config/ai-rulez/config.typescript.toml"
      - ".config/ai-rulez/domains/typescript/**"
      - ".config/hk/typescript.pkl"
  typst:
    label: "Typst"
    includes:
      - ".config/mise/config.typst.toml"
      - ".config/ai-rulez/config.typst.toml"
      - ".config/ai-rulez/domains/typst/**"
      - ".config/hk/typst.pkl"
