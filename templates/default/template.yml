---
schema_version: 1
$schema: ../../.config/turutan/schemas/template.schema.json
engine_version: dev
license: MIT-0
license-files: [LICENSE]
doc-files: [README.md]
includes:
    - .config/fnox.toml
    - .config/hk/core.pkl
    - .config/hk/custom.pkl
    - .config/hk/index.pkl.tmpl
    - .config/hk.pkl
    - .config/mise/config.custom.toml
    - .config/mise/config.toml
    - .config/miserc.toml.tmpl
    - .config/tombi.toml
    - .config/updatecli/mise-core.yaml
    - .gitignore.tmpl
    - .vscode/extensions.json.tmpl
    - .vscode/settings.json.tmpl
    - LICENSE
    - README.md.tmpl
excludes: []
preserves:
    - '**/*.local.*'
    - .config/mise/config.custom.toml
    - .config/fnox.toml
    - .config/hk/custom.pkl
    - .gitignore
conflict: inline
inputs:
    project_name:
        label: Project Name
        default: my-project
        type: string
    project_description:
        label: Project Description
        default: This project is ...
        type: string
    profiles:
        type: array
        label: Profiles
        options:
            - ai
            - c
            - cloudflare
            - cpp
            - csharp
            - docker
            - elixir
            - github
            - gitlab
            - go
            - java
            - kubernetes
            - php
            - python
            - r
            - ruby
            - rust
            - rust-polygot
            - typescript
            - astro
            - svelte
            - typst
        default: []
        help: Feature sets enabled per project
    ai_agents:
        if: '{{contains .profiles "ai"}}'
        type: array
        label: AI Agents
        options:
            - claude
            - cursor
            - gemini
            - copilot
            - devin
            - cline
            - codex
            - amp
            - junie
            - opencode
            - hermes
            - antigravity
            - xum
            - pi
            - baz
            - mcp
            - aiassistant
            - augment
            - bob
            - codebuddy
            - codebuff
            - codewhale
            - commandcode
            - copilot-cli
            - cortex
            - crush
            - deepagents
            - dsh
            - factory
            - gitlab-duo
            - goose
            - grok
            - kilo
            - kimi
            - kiro
            - letta
            - mimocode
            - muse
            - omp
            - openclaw
            - poolside
            - qoder
            - qwen
            - reasonix
            - replit
            - rovodev
            - takt
            - trae
            - vibe
            - warp
            - zcode
            - zed
            - zoocode
            - okf
            - llms-txt
        default:
            - pi
            - opencode
        help: ""
conditionals:
    - if: '{{contains .profiles "ai"}}'
      includes:
          - .config/ai-rulez/config.toml
          - .config/ai-rulez/config.ai.toml
          - .config/ai-rulez/domains/core/**
          - .config/ai-rulez/domains/ai/**
          - .config/ai-rulez/domains/pkl/**
          - .config/basemind/**
          - .uncomment.toml
          - .config/mise/config.ai.toml
          - .config/updatecli/mise-ai.yaml
          - .config/hk/ai.pkl
      excludes: []
      preserves:
          - .config/ai-rulez/config.custom.toml
          - .config/ai-rulez/domains/custom/**
    - if: '{{contains .profiles "c"}}'
      includes:
          - .config/mise/config.c.toml
          - .config/hk/c.pkl
      excludes: []
      preserves: []
    - if: '{{contains .profiles "cloudflare"}}'
      includes:
          - .config/mise/config.cloudflare.toml
          - .config/hk/cloudflare.pkl
      excludes: []
      preserves: []
