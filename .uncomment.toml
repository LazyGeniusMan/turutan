[global]
remove_todos = false
remove_fixme = false
remove_docs = true
preserve_patterns = ["HACK", "WORKAROUND", "SPDX-License-Identifier", "gitleaks", "betterleaks"]
exclude = []
use_default_ignores = true
respect_gitignore = true
traverse_git_repos = false

[languages.toml]
name = "TOML"
extensions = ["toml"]
comment_nodes = ["comment"]
doc_comment_nodes = []
preserve_patterns = ["tombi"]

[languages.pkl]
name = "Pkl"
extensions = ["pkl"]
comment_nodes = ["comment"]
preserve_patterns = []

[languages.yaml]
name = "YAML"
extensions = ["yaml", "yml"]
comment_nodes = ["comment"]
doc_comment_nodes = []
preserve_patterns = ["yamllint", "ansible-lint", "$schema"]

[languages.go]
name = "Go"
extensions = ["go"]
comment_nodes = ["comment"]
preserve_patterns = ["go:build", "go:generate", "go:embed", "go:cgo", "+build", "nolint", "#cgo", "#include"]

[patterns."tests/**/*"]
remove_todos = true

[patterns."**/*.spec.*"]
remove_docs = true
remove_todos = true

[patterns."**/*.generated.*"]
remove_docs = true
remove_todos = true
preserve_patterns = []
