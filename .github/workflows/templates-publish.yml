---
name: Templates publish
"on":
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to bump
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch
concurrency:
  group: templates-publish
  cancel-in-progress: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  publish:
    name: Publish default to GHCR
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write  # commit the bumped index back ~keep
      packages: write  # push the template artifact ~keep
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true  # push the bump commit back ~keep
      - name: Install tools
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac
      - name: Install
        run: mise install
      - name: Publish
        env:
          BUMP: ${{ inputs.bump }}
          TURUTAN_OCI_USER: ${{ github.actor }}
          TURUTAN_OCI_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go build -o "${RUNNER_TEMP}/turutan" ./cmd/turutan
          test -f registry.json || {
            echo "registry.json missing, refusing to re-init" >&2
            exit 1
          }
          line="$("${RUNNER_TEMP}/turutan" registry release \
            default "${BUMP}" oci --uri-override \
            oci://ghcr.io/lazygeniusman/turutan/templates/default)"
          printf '%s\n' "$line"
          version="${line#released default@}"
          version="${version%% *}"
          printf 'version=%s\n' "$version" >> "$GITHUB_ENV"
          git add registry.json  # index is tracked ~keep
          # manifests are committed truth ~keep
          git add "templates/default/manifest/${version}.json"
          git status --short
          git diff --cached --quiet || git commit -m \
            "chore: publish templates/default ${version}"
          git push
