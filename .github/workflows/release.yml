---
name: Release
on:
  push:
    tags:
      - v*
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac
      - name: Install
        run: mise install
      - name: Pre-commit
        run: mise run pre-commit
  release:
    name: Release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # goreleaser publishes releases ~keep
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac
        with:
          cache: false
      - name: Install
        run: mise install
      - name: Release
        run: mise run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
