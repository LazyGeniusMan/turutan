---
# yamllint disable rule:line-length
name: Scheduled
"on":
  schedule:
    - cron: 0 3 * * 1
  workflow_dispatch:
concurrency:
  group: scheduled-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  full-check:
    name: Scheduled check (full scope)
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 ~keep
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8  # v5.1.2 ~keep
      - name: Install
        run: mise install
      - name: Check (full scope)
        run: mise run check:all
