---
name: CI
# Scope rule, report 3.1/4/P1 ~keep: PR runs branch-diff gate, main runs full net.
# Both are binary pass/fail gates (P5); CI is check-only, never rewrites (P3).
on:
  pull_request:
  push:
    branches:
      - main
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  pr-check:
    name: PR check (diff scope)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac
      - name: Install
        run: mise install
      - name: Check (branch diff scope)
        run: mise run check:pr
  main-check:
    name: Main check (full scope)
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac
      - name: Install
        run: mise install
      - name: Check (full scope)
        run: mise run check:all
