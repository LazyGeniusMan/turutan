---
# SPDX-License-Identifier: Apache-2.0
version: 2
project_name: turutan
builds:
  - id: turutan
    binary: turutan
    main: ./cmd/turutan
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
archives:
  - id: turutan
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
checksum:
  name_template: checksums.txt
snapshot:
  version_template: "{{ .Tag }}-next"
release:
  header: >-
    CLI: Apache-2.0; default template: MIT-0; generated projects: MIT-0 or user
    choice.
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
