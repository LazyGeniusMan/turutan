version = "5.0"
name = "turutan"
gitignore = true
compact = true

presets = ["pi", "opencode"]

agents_md = true

[profiles]
core = ["core"]

[header]
text = """
AI-RULEZ GENERATED FILE — DO NOT EDIT DIRECTLY

ai-rulez is a standards-compliant lifecycle tool for agent knowledge and capabilities. You keep rules, context, skills, agents, commands, hooks, permissions and MCP servers in one source of truth then ai-rulez takes them through the whole lifecycle: author -> generate -> bundle -> lint/validate -> govern -> publish

Folder Structure:
.config/ai-rulez/config*.toml
.config/ai-rulez/domains/{domain-name}/{agents,context,rules,skills}

agents: Specialized role and persona for agents
context: Reference documentation, architecture, guidelines
rules: Mandatory constraints, standards, do's and don'ts
skills: On demand prompt and knowledge using Agent Skills format

INSTRUCTIONS FOR AI AGENTS
1. NEVER edit this file - it is auto-generated
2. ALWAYS edit files in .config/ai-rulez/ instead
3. PREFER using `ai-rulez` MCP Server, it provides safe CRUD tools for reading and modifying ai-rulez content
4. After making changes: mise run dev-setup:ai-rulez

Documentation: https://github.com/Goldziher/ai-rulez
"""
style = "detailed"
hashes = "content"
timestamp = false

[defaults]
omit_agent_fields = ["model", "effort", "tools"]

[lock]
# ~keep enforce = true

[lint]
# ~keep security.allowed_hosts = ["github.com", "owasp.org", "api.cloudflare.com", "developers.cloudflare.com", "go.dev", "pkg.go.dev", "pptr.dev", "flueframework.com", "ryl-docs.pages.dev", "pitchfork.jdx.dev", "hk.jdx.dev"]

[rules]
mode = "split"

[skills]
delivery = "both"

[mcp]
self_server = false
# ~keep self_server_command = ["ai-rulez", "mcp"]
skills_instructions = false
