[[mcp_servers]]
name = "ai-rulez"
command = "ai-rulez"
args = ["mcp"]
profiles = ["ai"]

[[mcp_servers]]
name = "fnox"
command = "fnox"
args = ["mcp"]
profiles = ["ai"]

[[mcp_servers]]
name = "mise"
env = { MISE_EXPERIMENTAL = "1" }
command = "mise"
args = ["mcp", "--cd", "${PROJECT_ROOT}"]
profiles = ["ai"]

[[mcp_servers]]
name = "hk"
command = "hk"
args = ["mcp", "--root", "${PROJECT_ROOT}"]
profiles = ["ai"]

[[mcp_servers]]
name = "basemind"
command = "basemind"
args = ["serve"]
profiles = ["ai"]

[[mcp_servers]]
name = "keenable"
transport = "http"
url = "https://api.keenable.ai/mcp"
headers = { "X-API-Key" = "${KEENABLE_API_KEY}" }
profiles = ["ai"]

[[mcp_servers]]
name = "cloudflare-docs"
transport = "http"
url = "https://docs.mcp.cloudflare.com/mcp"
profiles = ["cloudflare"]
