[settings]
minimum_release_age_excludes = [
  "github:Goldziher/ai-rulez",
  "npm:@opencode/cli",
  "npm:t3",
  "npm:@earendil-works/pi-coding-agent",
  "hk",
]

[env]
TURUTAN_BIN = "go run ./cmd/turutan"
TURUTAN_CONFIG = "{{ config_root }}/.config/turutan/dogfood-user.yml"
TURUTAN_TEMPLATE = "local/default@0.1.0"
PROTON_PASS_KEY_PROVIDER = "{{ exec(command='sh scripts/proton-pass-detect-key-provider.sh') | trim }}"

[tools]
node = "24"
"npm:@opencode/cli" = { version = "2" }
"github:protonpass/pass-cli" = "2"
"npm:@earendil-works/pi-coding-agent" = "1"
"npm:t3" = { prefix = "0.0.46-nightly", prerelease = 1 }

[daemons.opencode]
init = "mise run dev-setup:fnox"
run = "exec fnox x -- opencode serve --port $PORT"
port = 4096

[daemons.t3code]
init = "mise run dev-setup:fnox"
run = "exec fnox x -- t3 serve --port $PORT --dev-url {{ env.PROXY_URI | replace(from='{{port}}', to=env.PORT) }}"
port = 3773

[tasks."dev-setup:ai-rulez"]
depends = "dev-setup:fnox"
secrets = ["KEENABLE_API_KEY", "FNOX_GITHUB_TOKEN"]
env = { "AI_RULEZ_GIT_TOKEN" = "{{ secrets.FNOX_GITHUB_TOKEN }}" }
run = "ai-rulez migrate okf && ai-rulez generate"

[tasks."dev:opencode:start"]
depends = "dev-setup:fnox"
daemons = "opencode"
run = "echo 'OpenCode Web UI is running on {{ env.PROXY_URI | replace(from='{{port}}', to=env.OPENCODE_PORT) }}'"

[tasks."dev:opencode:pair"]
depends = "dev:opencode:start"
run = "opencode pair --url {{ env.PROXY_URI | replace(from='{{port}}', to=env.OPENCODE_PORT) }}"

[tasks."dev:t3code:start"]
depends = "dev-setup:fnox"
daemons = "t3code"
run = "t3 browser setup && echo 'T3 Code Web UI is running on {{ env.PROXY_URI | replace(from='{{port}}', to=env.T3CODE_PORT) }}'"

[tasks."dev:t3code:pair"]
depends = "dev:t3code:start"
run = "t3 pair"

[tasks."dev-setup:fnox-provider"]
secrets = ["PROTON_PASS_PERSONAL_ACCESS_TOKEN"]
run = '''
if ! pass-cli info; then
    pass-cli logout
    pass-cli login
fi
'''

[tasks."turutan:diff"]
description = "Show template drift for this project"
run = "${TURUTAN_BIN} diff"

[tasks."turutan:check"]
description = "Check whether the template has updates"
run = "${TURUTAN_BIN} check"

[tasks."turutan:update"]
description = "Merge template updates into this project"
run = "${TURUTAN_BIN} update"

[tasks."turutan:state-sync"]
description = "Re-render hand-edited state inputs at the pinned commit"
run = "${TURUTAN_BIN} state sync"

[tasks."turutan:state-input"]
description = "Re-answer stored inputs and re-render at the pinned commit"
run = "${TURUTAN_BIN} state input"

[tasks."turutan:profiles"]
description = "List template profiles offered and enabled"
run = "${TURUTAN_BIN} profiles"

[tasks."turutan:release"]
description = "Rebuild the gitignored fs dogfood overlay from the committed created-but-unreleased index plus source tree; never mutates committed files"
run = """
overlay=".tmp/turutan-dogfood"
bin="$overlay/.bin/turutan"
rm -rf "$overlay"
mkdir -p "$overlay/templates" "$(dirname "$bin")"
cp registry.json "$overlay/registry.json"
cp -r templates/. "$overlay/templates/"
go build -o "$bin" ./cmd/turutan
if [ ! -f "$overlay/registry.json" ]; then
  ( cd "$overlay" && ./.bin/turutan registry init --name turutan --author "Andriyansyah Nurrachman <git@yansyah.my.id> (https://yansyah.my.id)" )
fi
( cd "$overlay" && ./.bin/turutan registry release default same fs --force )
if [ ! -f .config/turutan/state.yml ]; then
  tmp=$(mktemp -d)
  ${TURUTAN_BIN:-turutan} init "$tmp" --data-file .config/turutan/dogfood-data.yml --defaults --non-interactive
  cp "$tmp/.config/turutan/state.yml" .config/turutan/state.yml
  cp "$tmp/.config/turutan/lock.json" .config/turutan/lock.json
  mkdir -p .config/turutan/templates
  cp -r "$tmp/.config/turutan/templates/." .config/turutan/templates/
  rm -rf "$tmp"
fi
"""
